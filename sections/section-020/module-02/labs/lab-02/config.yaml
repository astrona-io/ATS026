# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Repair A Network Policy (LAB). Graded against the live cluster. Status: UNTESTED (static checks only).
apiVersion: astrona.io/v1
metadata:
  name: ats-026-lab-020-02-02
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - curlimages/curl:8.22.0
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - nginx:1.31.6-alpine
    nodes:
      workers: 1
    addons:
      cni: calico

bootstrap:
  init:
    - name: seed-cluster
      description: Create the workloads and the starting state
      type: file
      source: bootstrap/01-seed-cluster.sh

testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: shuttle-reaches-probe
      description: "The shuttle Pod reaches the probe Service"
      type: file
      source: validation/validate-shuttle-reaches-probe.sh
      hint: "Compare the label in the policy with the real Pod labels, and compare the policy port with the container port of probe."
    - name: drifter-blocked-from-probe
      description: "The drifter Pod in outpost cannot reach the probe Service in starfleet"
      type: file
      source: validation/validate-drifter-blocked-from-probe.sh
      hint: "Fix the values in the policy. Do not widen the policy to admit every source."
    - name: probe-ingress-kept
      description: "The policy probe-ingress still selects app=probe and is the only policy in starfleet"
      type: file
      source: validation/validate-probe-ingress-kept.sh
      hint: "Edit the existing policy. Do not delete it and do not add a second policy."

teardown:
  keepCluster: false
