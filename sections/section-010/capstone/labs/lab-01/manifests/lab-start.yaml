---
apiVersion: v1
kind: Namespace
metadata:
  name: starfleet
  labels:
    team: starfleet
---
apiVersion: v1
kind: Namespace
metadata:
  name: outpost
  labels:
    team: outpost
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe
  namespace: starfleet
  labels:
    app: probe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: probe
  template:
    metadata:
      labels:
        app: probe
    spec:
      containers:
      - name: probe
        image: mccutchen/go-httpbin:2.25.0
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: probe
  namespace: starfleet
spec:
  selector:
    app: probe
  ports:
  - name: http
    port: 80
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shuttle
  namespace: starfleet
  labels:
    app: shuttle
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shuttle
  template:
    metadata:
      labels:
        app: shuttle
    spec:
      containers:
      - name: shuttle
        image: curlimages/curl:8.22.0
        command:
        - sh
        - "-c"
        - while true; do sleep 30; done
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 32Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe
  namespace: outpost
  labels:
    app: probe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: probe
  template:
    metadata:
      labels:
        app: probe
    spec:
      containers:
      - name: probe
        image: mccutchen/go-httpbin:2.25.0
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: probe
  namespace: outpost
spec:
  selector:
    app: probe
  ports:
  - name: http
    port: 80
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drifter
  namespace: outpost
  labels:
    app: drifter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: drifter
  template:
    metadata:
      labels:
        app: drifter
    spec:
      containers:
      - name: drifter
        image: curlimages/curl:8.22.0
        command:
        - sh
        - "-c"
        - while true; do sleep 30; done
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 32Mi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: signal-conf
  namespace: starfleet
data:
  default.conf: |
    server {
      listen 127.0.0.1:8080;
      location / {
        return 200 "signal ready\n";
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: signal
  namespace: starfleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: signal
  template:
    metadata:
      labels:
        app: signal
    spec:
      containers:
        - name: nginx
          image: nginx:1.31.6-alpine
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: conf
          configMap:
            name: signal-conf
---
apiVersion: v1
kind: Service
metadata:
  name: signal
  namespace: starfleet
spec:
  selector:
    app: signal
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lantern
  namespace: starfleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lantern
  template:
    metadata:
      labels:
        app: lantern
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          ports:
            - containerPort: 9898
---
apiVersion: v1
kind: Service
metadata:
  name: lantern
  namespace: starfleet
spec:
  selector:
    app: lantern
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dock
  namespace: starfleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dock
  template:
    metadata:
      labels:
        app: dock
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          ports:
            - containerPort: 9898
---
apiVersion: v1
kind: Service
metadata:
  name: dock
  namespace: starfleet
spec:
  selector:
    app: docks
  ports:
    - port: 80
      targetPort: 9898
