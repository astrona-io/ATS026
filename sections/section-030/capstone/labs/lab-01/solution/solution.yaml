apiVersion: v1
kind: Service
metadata:
  name: probe
  namespace: starfleet
spec:
  type: NodePort
  selector:
    app: probe
    tier: web
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 300
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30090
---
apiVersion: v1
kind: Service
metadata:
  name: probe-peers
  namespace: starfleet
spec:
  clusterIP: None
  selector:
    app: probe
  ports:
    - name: http
      port: 80
      targetPort: http
