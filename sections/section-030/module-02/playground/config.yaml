# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Headless Services, ExternalName And Traffic Policy (PLAYGROUND). Clean environment for free exploration: no task, no grading.
# Status: UNTESTED (static checks only).
apiVersion: astrona.io/v1
metadata:
  name: ats-026-playground-030-02
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - docker.io/library/busybox:1.37.0
      - ghcr.io/stefanprodan/podinfo:6.15.0
    nodes:
      workers: 1

bootstrap:
  manifests:
    - name: starfleet
      type: file
      source: manifests/lab-start.yaml
  waitFor:
    - resource: deploy/probe
      namespace: starfleet
    - resource: deploy/shuttle
      namespace: starfleet
    - resource: deploy/ledger
      namespace: outpost

teardown:
  keepCluster: false
