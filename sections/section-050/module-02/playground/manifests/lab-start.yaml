apiVersion: v1
kind: Namespace
metadata:
  name: starfleet
  labels:
    team: starfleet
---
apiVersion: v1
kind: Namespace
metadata:
  name: outpost
  labels:
    team: outpost
---
apiVersion: v1
kind: Namespace
metadata:
  name: ingress-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: scout-conf
  namespace: starfleet
data:
  default.conf: |
    server {
      listen 8080;
      location / {
        return 200 "scout host=$host path=$uri\n";
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scout
  namespace: starfleet
  labels:
    app: scout
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scout
  template:
    metadata:
      labels:
        app: scout
    spec:
      containers:
        - name: scout
          image: nginx:1.31.6-alpine
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: conf
          configMap:
            name: scout-conf
---
apiVersion: v1
kind: Service
metadata:
  name: scout
  namespace: starfleet
spec:
  selector:
    app: scout
  ports:
    - name: http
      port: 80
      targetPort: http
---
