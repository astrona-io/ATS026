# Reading-only course. YAML assessments are registered separately in assessments/index.yaml.
training:
  id: ATS026
  title: 'CKA: Services & Networking'
  description: Detailed reading lessons and reusable YAML knowledge checks covering the CKA domain. No
    new labs or playgrounds. Technical content remains draft for review.
  certification:
    name: Certified Kubernetes Administrator
    code: CKA
    provider: CNCF / Linux Foundation
    domain: Services & Networking
    weight: 20
    competencies:
    - Understand connectivity between Pods
    - Define and enforce Network Policies
    - Use ClusterIP, NodePort, LoadBalancer service types and endpoints
    - Use the Gateway API to manage Ingress traffic
    - Know how to use Ingress controllers and Ingress resources
    - Understand and use CoreDNS
